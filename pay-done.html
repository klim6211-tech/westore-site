<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 결과 | 위스토어</title>
<link rel="icon" href="logo.png">
<style>
  :root{--brand:#5B8DEF;--brand-dark:#2A45C3;--brand-soft:#EEF4FF;--text:#1B2533;--body:#4E5968;--muted:#8B95A1;--line:#E7ECF3;--alt:#F7F9FC}
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}
  .box{margin:80px auto;text-align:center}
  .ico{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 22px}
  .ok .ico{background:var(--brand-soft);color:var(--brand-dark)}
  .no .ico{background:#FFF1F0;color:#C0392B}
  h1{font-size:26px;letter-spacing:-.8px;margin:0 0 10px;font-weight:800}
  p{color:var(--body);margin:0 0 8px;font-size:16px}
  .sub{color:var(--muted);font-size:15px}
  table{border-collapse:collapse;width:100%;font-size:15px;margin:26px 0;text-align:left}
  th,td{border:1px solid var(--line);padding:11px 14px}
  th{background:var(--alt);font-weight:700;width:40%;white-space:nowrap}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .btn{display:inline-block;padding:14px 26px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none}
  .btn.p{background:var(--brand);color:#fff}
  .btn.s{background:var(--brand-soft);color:var(--brand-dark)}
  .help{margin-top:34px;font-size:14px;color:var(--muted);line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <div class="box" id="box">
    <div class="ico">…</div>
    <h1>결제 결과를 확인하고 있습니다</h1>
    <p class="sub">잠시만 기다려 주세요.</p>
  </div>
</div>

<script>
  var q = new URLSearchParams(location.search);
  var APPROVE_URL = 'https://mhbpqddbldelqcsbafbn.supabase.co/functions/v1/kakaopay-approve';
  var box = document.getElementById('box');

  function render(kind, title, desc, rows) {
    var t = '';
    if (rows && rows.length) {
      t = '<table>' + rows.map(function (r) {
        return '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>';
      }).join('') + '</table>';
    }
    box.className = 'box ' + kind;
    box.innerHTML =
      '<div class="ico">' + (kind === 'ok' ? '✓' : '!') + '</div>' +
      '<h1>' + title + '</h1><p>' + desc + '</p>' + t +
      '<div class="btns">' +
      (kind === 'ok'
        ? '<a class="btn p" href="https://apps.apple.com/kr/app/id6786059592">위스토어 앱 열기</a>'
        : '<a class="btn p" href="order.html">다시 시도하기</a>') +
      '<a class="btn s" href="index.html">홈으로</a></div>' +
      '<div class="help">문의 010-5123-6859 (평일 10:00~18:00) · klim6211@gmail.com<br>마잇템즈 · 사업자등록번호 139-39-01457</div>';
  }

  var result = q.get('result');
  if (result === 'cancel') {
    render('no', '결제를 취소하셨습니다', '아직 아무것도 청구되지 않았습니다. 언제든 다시 신청하실 수 있습니다.');
  } else if (result === 'fail') {
    render('no', '결제가 완료되지 않았습니다', '카드사에서 승인이 거절되었거나 도중에 창이 닫혔습니다. 청구된 금액은 없습니다.');
  } else {
    var pgToken = q.get('pg_token');
    var orderId = q.get('orderId');
    if (!pgToken || !orderId) {
      render('no', '결제 정보를 찾지 못했습니다', '주소가 잘못되었거나 시간이 지나 만료되었습니다. 청구된 금액은 없습니다.');
    } else {
      fetch(APPROVE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pgToken: pgToken, orderId: orderId })
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.body && res.body.message ? res.body.message : '승인에 실패했습니다.');
          var b = res.body;
          render('ok', '결제가 완료되었습니다',
            '<b>지금 바로 이용하실 수 있습니다.</b> 위스토어 앱을 열면 AI 리뷰 관리가 켜져 있습니다. 별도 배송은 없습니다.',
            [
              ['상품', '성장 — AI 리뷰 관리 (월 자동결제)'],
              ['매장', b.storeName || '-'],
              ['결제 금액', (b.amount || 33000).toLocaleString() + '원 (부가세 포함)'],
              ['결제 수단', b.method || '신용·체크카드'],
              ['이용 시작', '결제 완료 즉시'],
              ['다음 결제일', b.nextBillingDate || '한 달 뒤 같은 날'],
            ]);
        })
        .catch(function (e) {
          render('no', '결제 승인 중 문제가 생겼습니다',
            e.message + ' 카드에서 실제로 빠져나갔는지 확인이 필요합니다. 아래 번호로 연락 주시면 바로 확인해 드리겠습니다.');
        });
    }
  }
</script>
</body>
</html>
